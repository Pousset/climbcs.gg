# Local PostgreSQL for development. Use with DB_TYPE=postgres in apps/api/.env
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cs2
      POSTGRES_PASSWORD: cs2
      POSTGRES_DB: cs2
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cs2']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
